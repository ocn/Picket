services:
  postgres:
    container_name: killbot-contract-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: killbot_contracts
      POSTGRES_USER: killbot_contracts
      POSTGRES_PASSWORD: ${CONTRACT_DATABASE_PASSWORD:-killbot_contracts}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - contract-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killbot_contracts -d killbot_contracts"]
      interval: 5s
      timeout: 5s
      retries: 10

  discordbot:
    container_name: discordbot
    image: ocn-killbot-rust:latest
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      EVE_CLIENT_ID: ${EVE_CLIENT_ID}
      EVE_CLIENT_SECRET: ${EVE_CLIENT_SECRET}
      KILLMAIL_FEED_PROVIDER: r2z2
      CONTRACT_DATABASE_URL: postgres://killbot_contracts:${CONTRACT_DATABASE_PASSWORD:-killbot_contracts}@postgres:5432/killbot_contracts
      CONTRACT_COLLECTION_INTERVAL_SECS: ${CONTRACT_COLLECTION_INTERVAL_SECS:-300}
    volumes:
      - ./config:/app/config:delegated
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  contract-postgres:

networks:
  default:
    name: bot-network
    driver: bridge
