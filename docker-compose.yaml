services:
  postgres:
    container_name: killbot-contract-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: killbot_contracts
      POSTGRES_USER: killbot_contracts
      POSTGRES_PASSWORD: ${CONTRACT_DATABASE_PASSWORD:-killbot_contracts}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - contract-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killbot_contracts -d killbot_contracts"]
      interval: 5s
      timeout: 5s
      retries: 10

  discordbot:
    container_name: discordbot
    image: ocn-killbot-rust:latest
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      EVE_CLIENT_ID: ${EVE_CLIENT_ID}
      EVE_CLIENT_SECRET: ${EVE_CLIENT_SECRET}
      KILLMAIL_FEED_PROVIDER: r2z2
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:-postgres://killbot_contracts:killbot_contracts@postgres:5432/killbot_contracts}
      CONTRACT_COLLECTION_INTERVAL_SECS: ${CONTRACT_COLLECTION_INTERVAL_SECS:-300}
      CONTRACT_REGIONAL_CONCURRENCY: ${CONTRACT_REGIONAL_CONCURRENCY:-2}
      HEALTH_EVALUATION_INTERVAL_SECS: ${HEALTH_EVALUATION_INTERVAL_SECS:-60}
      HEALTH_CHANNEL_ID: ${HEALTH_CHANNEL_ID:-1538030920328810536}
      HEALTH_HEARTBEAT_DEGRADED_SECS: ${HEALTH_HEARTBEAT_DEGRADED_SECS:-300}
      HEALTH_HEARTBEAT_CRITICAL_SECS: ${HEALTH_HEARTBEAT_CRITICAL_SECS:-600}
      HEALTH_POSTGRES_DEGRADED_FAILURES: ${HEALTH_POSTGRES_DEGRADED_FAILURES:-1}
      HEALTH_POSTGRES_CRITICAL_FAILURES: ${HEALTH_POSTGRES_CRITICAL_FAILURES:-3}
      HEALTH_CONTRACT_PROGRESS_DEGRADED_SECS: ${HEALTH_CONTRACT_PROGRESS_DEGRADED_SECS:-900}
      HEALTH_CONTRACT_PROGRESS_CRITICAL_SECS: ${HEALTH_CONTRACT_PROGRESS_CRITICAL_SECS:-1800}
      HEALTH_ESI_PROGRESS_DEGRADED_SECS: ${HEALTH_ESI_PROGRESS_DEGRADED_SECS:-900}
      HEALTH_ESI_PROGRESS_CRITICAL_SECS: ${HEALTH_ESI_PROGRESS_CRITICAL_SECS:-1800}
      HEALTH_BACKLOG_DEGRADED_SECS: ${HEALTH_BACKLOG_DEGRADED_SECS:-1800}
      HEALTH_BACKLOG_CRITICAL_SECS: ${HEALTH_BACKLOG_CRITICAL_SECS:-7200}
      HEALTH_PREPARED_DELIVERY_DEGRADED_SECS: ${HEALTH_PREPARED_DELIVERY_DEGRADED_SECS:-300}
      HEALTH_PREPARED_DELIVERY_CRITICAL_SECS: ${HEALTH_PREPARED_DELIVERY_CRITICAL_SECS:-900}
      HEALTH_R2Z2_PROGRESS_DEGRADED_SECS: ${HEALTH_R2Z2_PROGRESS_DEGRADED_SECS:-180}
      HEALTH_R2Z2_PROGRESS_CRITICAL_SECS: ${HEALTH_R2Z2_PROGRESS_CRITICAL_SECS:-600}
      HEALTH_FEED_VALIDATION_DEGRADED_FAILURES: ${HEALTH_FEED_VALIDATION_DEGRADED_FAILURES:-1}
      HEALTH_FEED_VALIDATION_CRITICAL_FAILURES: ${HEALTH_FEED_VALIDATION_CRITICAL_FAILURES:-3}
    volumes:
      - ./config:/app/config:delegated

volumes:
  contract-postgres:

networks:
  default:
    name: bot-network
    driver: bridge
